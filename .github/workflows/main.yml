name: Cody

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Hours to stay active (1-6)'
        required: true
        default: '4'

jobs:
  cody-job:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Cody - Install
        run: |
          $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.4.6/rustdesk-1.4.6-x86_64.exe"
          $installer = "$env:TEMP\rustdesk_installer.exe"
          
          Write-Host "Cody: Downloading RustDesk..."
          Invoke-WebRequest -Uri $rdUrl -OutFile $installer
          
          Write-Host "Cody: Starting Silent Install (Waiting for completion)..."
          $process = Start-Process -FilePath $installer -ArgumentList "--silent-install" -PassThru -NoNewWindow
          $process.WaitForExit()
          
          Write-Host "Cody: Waiting for service installation to complete..."
          $timeout = 0
          while (!(Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue) -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout++
          }
          
          $timeout = 0
          while ((Get-Service -Name "RustDesk").Status -ne 'Running' -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout++
          }

      - name: Cody - Create Admin User
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORDD }}
        run: |
          $rdPass = $env:RUSTDESK_PASSWORD
          
          if ([string]::IsNullOrWhiteSpace($rdPass)) {
              Write-Error "Cody: RUSTDESK_PASSWORD secret is empty or not configured in GitHub Secrets."
              exit 1
          }
          
          $adminUsername = "admin"
          Write-Host "========================================"
          Write-Host "Cody: Creating local admin user..."
          Write-Host "========================================"
          
          try {
              $existingUser = Get-LocalUser -Name $adminUsername -ErrorAction Stop
              Write-Host "Cody: User '$adminUsername' already exists. Checking status..."
              
              if ($existingUser.Enabled) {
                  Write-Host "Cody: User '$adminUsername' is enabled and ready."
              } else {
                  Write-Host "Cody: User '$adminUsername' is disabled. Enabling..."
                  Enable-LocalUser -Name $adminUsername
                  Write-Host "Cody: User '$adminUsername' has been enabled."
              }
          }
          catch {
              Write-Host "Cody: User '$adminUsername' does not exist. Creating..."
              
              try {
                  $securePassword = ConvertTo-SecureString -String $rdPass -AsPlainText -Force
                  New-LocalUser -Name $adminUsername `
                      -Password $securePassword `
                      -FullName "Cody Admin User" `
                      -Description "Local admin account for RustDesk" `
                      -AccountNeverExpires `
                      -PasswordNeverExpires
                  
                  Write-Host "Cody: User '$adminUsername' created successfully."
              }
              catch {
                  Write-Error "Cody: Failed to create user: $_"
                  exit 1
              }
          }
          
          Write-Host "Cody: Verifying user creation..."
          try {
              $user = Get-LocalUser -Name $adminUsername -ErrorAction Stop
              Write-Host "Cody: ✓ User exists: $($user.Name)"
              Write-Host "Cody: ✓ User Enabled: $($user.Enabled)"
              Write-Host "Cody: ✓ User Account Type: $($user.ObjectClass)"
          }
          catch {
              Write-Error "Cody: Failed to verify user creation: $_"
              exit 1
          }
          
          Write-Host "Cody: Validating password credentials..."
          try {
              Add-Type -AssemblyName System.DirectoryServices.AccountManagement
              $contextType = [System.DirectoryServices.AccountManagement.ContextType]::Machine
              $principalContext = New-Object System.DirectoryServices.AccountManagement.PrincipalContext($contextType)
              
              $isPasswordValid = $principalContext.ValidateCredentials($adminUsername, $rdPass)
              
              if ($isPasswordValid) {
                  Write-Host "Cody: ✓ Password validation successful"
              } else {
                  Write-Error "Cody: Password validation failed. Password may be incorrect."
                  exit 1
              }
          }
          catch {
              Write-Error "Cody: Failed to validate credentials: $_"
              exit 1
          }
          
          Write-Host "Cody: Adding user to Administrators group..."
          try {
              Add-LocalGroupMember -Group "Administrators" -Member $adminUsername -ErrorAction SilentlyContinue
              Write-Host "Cody: ✓ User added to Administrators group"
          }
          catch {
              Write-Warning "Cody: User may already be in Administrators group or error occurred: $_"
          }
          
          Write-Host "Cody: Running final verification checks..."
          $finalUser = Get-LocalUser -Name $adminUsername
          
          if (!$finalUser.Enabled) {
              Write-Error "Cody: User account is disabled. Cannot proceed."
              exit 1
          }
          
          $adminGroup = Get-LocalGroup -Name "Administrators"
          $isAdmin = Get-LocalGroupMember -Group $adminGroup | Where-Object { $_.Name -like "*$adminUsername" }
          
          if ($isAdmin) {
              Write-Host "Cody: ✓ User is member of Administrators group"
          } else {
              Write-Warning "Cody: User is not in Administrators group. Attempting to add..."
              try {
                  Add-LocalGroupMember -Group "Administrators" -Member $adminUsername -Force
                  Write-Host "Cody: ✓ User added to Administrators group (forced)"
              }
              catch {
                  Write-Error "Cody: Failed to add user to Administrators: $_"
                  exit 1
              }
          }
          
          Write-Host "========================================"
          Write-Host "Cody: Admin user setup completed successfully!"
          Write-Host "========================================"
          
          Add-Content -Path $env:GITHUB_ENV -Value "ADMIN_USER=$adminUsername"
          Add-Content -Path $env:GITHUB_ENV -Value "ADMIN_PASSWORD=$rdPass"

      - name: Cody - Config
        env:
          RUSTDESK_PASSWORDD: ${{ secrets.RUSTDESK_PASSWORDD }}
          ADMIN_USER: ${{ env.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          $rdPass = $env:RUSTDESK_PASSWORDD
          $adminUser = $env:ADMIN_USER
          $computerName = $env:COMPUTERNAME
          
          if ([string]::IsNullOrWhiteSpace($rdPass)) {
              Write-Error "Cody: RUSTDESK_PASSWORDD secret is empty or not configured."
              exit 1
          }
          
          Write-Host "========================================"
          Write-Host "Cody: Configuring RustDesk as admin user..."
          Write-Host "========================================"
          
          $service = Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          if ($null -eq $service) {
              Write-Error "Cody: RustDesk service is not installed."
              exit 1
          }
          if ($service.Status -ne 'Running') {
              Write-Host "Cody: Starting RustDesk service..."
              Start-Service -Name "RustDesk" -Force
              Start-Sleep -Seconds 5
          }
          
          $tomlContent = @(
              "[options]",
              "verification-method = 'use-both-passwords'",
              "approve-mode = 'both'",
              "allow-remote-config-modification = 'Y'",
              "allow-logon-screen-password = 'Y'"
          ) -join "`r`n"

          $paths = @(
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config",
              "$env:APPDATA\RustDesk\config"
          )
          foreach ($p in $paths) {
              if (!(Test-Path $p)) {
                  New-Item -ItemType Directory -Path $p -Force | Out-Null
              }
              $tomlPath = Join-Path $p "RustDesk2.toml"
              $tomlContent | Set-Content $tomlPath -Force
          }
          
          Write-Host "Cody: Creating configuration script..."
          $tempScript = "$env:TEMP\rustdesk_config_$([System.DateTime]::Now.Ticks).ps1"
          
          $line1 = 'Write-Host "Cody: Running RustDesk configuration as admin user..."'
          $line2 = '$rdExe = "' + $rdExe + '"'
          $line3 = '$rdPass = "' + $rdPass + '"'
          $line4 = 'try {'
          $line5 = '    Write-Host "Cody: Setting verification method..."'
          $line6 = '    & $rdExe --option verification-method use-both-passwords'
          $line7 = '    Write-Host "Cody: Setting approve mode..."'
          $line8 = '    & $rdExe --option approve-mode both'
          $line9 = '    Write-Host "Cody: Setting password..."'
          $line10 = '    & $rdExe --password $rdPass'
          $line11 = '    Write-Host "Cody: Configuration completed successfully."'
          $line12 = '}'
          $line13 = 'catch {'
          $line14 = '    Write-Error "Cody: Configuration failed: $_"'
          $line15 = '    exit 1'
          $line16 = '}'
          
          $scriptLines = @($line1, $line2, $line3, $line4, $line5, $line6, $line7, $line8, $line9, $line10, $line11, $line12, $line13, $line14, $line15, $line16)
          $scriptLines -join "`n" | Set-Content -Path $tempScript -Force
          
          Write-Host "Cody: Configuration script created at: $tempScript"
          
          Write-Host "Cody: Executing configuration as admin user via runas..."
          try {
              $runasCmd = "powershell.exe -ExecutionPolicy Bypass -File ""$tempScript"""
              $process = Start-Process -FilePath "runas.exe" -ArgumentList "/user:$computerName\$adminUser /profile $runasCmd" -Wait -NoNewWindow -PassThru
              Write-Host "Cody: Configuration executed (Exit Code: $($process.ExitCode))"
          }
          catch {
              Write-Warning "Cody: Runas execution issue: $_"
              Write-Host "Cody: Attempting direct configuration..."
              
              Push-Location "C:\Program Files\RustDesk"
              try {
                  & .\rustdesk.exe --option verification-method use-both-passwords
                  & .\rustdesk.exe --option approve-mode both
                  & .\rustdesk.exe --password $rdPass
                  Write-Host "Cody: Direct configuration completed."
              }
              catch {
                  Write-Error "Cody: Direct configuration failed: $_"
              }
              Pop-Location
          }
          
          Write-Host "Cody: Restarting RustDesk service..."
          Restart-Service -Name "RustDesk" -Force
          Start-Sleep -Seconds 15
          
          Write-Host "Cody: Retrieving RustDesk ID..."
          Push-Location "C:\Program Files\RustDesk"
          $id = ""
          $retries = 0
          while ([string]::IsNullOrWhiteSpace($id) -and $retries -lt 10) {
              try {
                  $id = (& .\rustdesk.exe --get-id | Out-String).Trim()
                  if ([string]::IsNullOrWhiteSpace($id)) {
                      Write-Host "Cody: ID not ready, waiting... (Attempt $($retries + 1)/10)"
                      Start-Sleep -Seconds 5
                      $retries++
                  }
              }
              catch {
                  Write-Warning "Cody: Error retrieving ID: $_"
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }
          Pop-Location
          
          Write-Host "========================================"
          Write-Host "CODY RUSTDESK ID : $id"
          Write-Host "CODY PASSWORD    : [HIDDEN FOR SECURITY]"
          Write-Host "CODY ADMIN USER  : $adminUser"
          Write-Host "========================================"
          
          if ([string]::IsNullOrWhiteSpace($id)) {
              Write-Error "Cody: Could not retrieve a valid ID after 10 attempts."
              exit 1
          }
          
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTDESK_ID=$id"
          Remove-Item -Path $tempScript -Force -ErrorAction SilentlyContinue

      - name: Cody - Session
        run: |
          $hours = [int]"${{ github.event.inputs.session_duration }}"
          if ($hours -gt 6) { $hours = 6 }
          $seconds = $hours * 3600
          
          Write-Host "========================================"
          Write-Host "Cody: Runner is active. Connection details above."
          Write-Host "Cody: Session will end in $hours hour(s)."
          Write-Host "========================================"
          
          $startTime = Get-Date
          $elapsedMinutes = 0
          
          while (((Get-Date) - $startTime).TotalSeconds -lt $seconds) {
              Start-Sleep -Seconds 60
              $elapsedMinutes++
              if ($elapsedMinutes % 5 -eq 0) {
                  $remainingTime = [math]::Round(($seconds - ((Get-Date) - $startTime).TotalSeconds) / 60, 0)
                  Write-Host "Cody: Session active... $remainingTime minutes remaining"
              }
          }
          
          Write-Host "========================================"
          Write-Host "Cody: Session timeout reached. Ending workflow."
          Write-Host "========================================"
