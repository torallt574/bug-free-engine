name: Cody

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Hours to stay active (1-6)'
        required: true
        default: '4'

jobs:
  cody-job:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # Step 1: Create the codyuser account
      - name: Cody - Create User
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORDD }}   # Secret name unchanged
        run: |
          $password = $env:RUSTDESK_PASSWORD
          $username = "codyuser"
          
          Write-Host "Cody: Creating user '$username'..."
          $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
          
          try {
              Get-LocalUser -Name $username -ErrorAction Stop
              Write-Host "Cody: User already exists"
          }
          catch {
              New-LocalUser -Name $username -Password $securePassword -PasswordNeverExpires -Description "RustDesk Service User"
              Write-Host "Cody: User created"
          }
          
          Write-Host "Cody: Adding user to Administrators..."
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Write-Host "Cody: User setup complete"
          
          # Store credentials for later steps
          Add-Content -Path $env:GITHUB_ENV -Value "CODY_USER=$username"
          Add-Content -Path $env:GITHUB_ENV -Value "CODY_PASS=$password"

      # Step 2: Grant logon rights so we can run processes as codyuser
      - name: Cody - Grant Logon Rights
        run: |
          $username = $env:CODY_USER
          $computerName = $env:COMPUTERNAME
          $fullUsername = "$computerName\$username"
          
          Write-Host "Cody: Granting 'Log on as a batch job' and 'Log on as a service' to $fullUsername"
          
          $secpolPath = "$env:TEMP\secpol.cfg"
          secedit /export /cfg $secpolPath | Out-Null
          
          $sid = (New-Object System.Security.Principal.NTAccount($fullUsername)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          
          $content = Get-Content $secpolPath
          $newContent = foreach ($line in $content) {
              if ($line -match "^SeServiceLogonRight\s*=" -and $line -notmatch [regex]::Escape($sid)) {
                  $line = $line.TrimEnd() + ",*$sid"
              }
              if ($line -match "^SeBatchLogonRight\s*=" -and $line -notmatch [regex]::Escape($sid)) {
                  $line = $line.TrimEnd() + ",*$sid"
              }
              $line
          }
          $newContent | Set-Content $secpolPath -Force
          
          secedit /configure /db secedit.sdb /cfg $secpolPath /areas USER_RIGHTS | Out-Null
          Write-Host "Cody: Rights granted"

      # Step 3: Switch to codyuser, download/install/configure RustDesk
      - name: Cody - Setup RustDesk as codyuser
        run: |
          $username = $env:CODY_USER
          $password = $env:CODY_PASS
          $computerName = $env:COMPUTERNAME
          $fullUsername = "$computerName\$username"
          
          # Prepare a script to run as codyuser, using environment variable for password
          $scriptContent = @'
          Write-Host "Cody: Downloading RustDesk..."
          $installer = "C:\Users\Public\Downloads\rustdesk.exe"
          New-Item -ItemType Directory -Path "C:\Users\Public\Downloads" -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.4.6/rustdesk-1.4.6-x86_64.exe" -OutFile $installer
          
          Write-Host "Cody: Installing RustDesk..."
          Start-Process -FilePath $installer -ArgumentList "--silent-install" -Wait -NoNewWindow
          Start-Sleep -Seconds 15
          
          Write-Host "Cody: Setting RustDesk password via CLI..."
          $password = $env:CODY_PASS
          & "C:\Program Files\RustDesk\rustdesk.exe" --password $password
          Start-Sleep -Seconds 5
          
          Write-Host "Cody: Starting RustDesk..."
          Start-Process "C:\Program Files\RustDesk\rustdesk.exe"
          Start-Sleep -Seconds 10
          
          Write-Host "Cody: Getting RustDesk ID..."
          $id = (& "C:\Program Files\RustDesk\rustdesk.exe" --get-id 2>&1 | Out-String).Trim()
          
          # Save ID to a file in Public to avoid permission issues
          Set-Content -Path "C:\Users\Public\rustdesk_id.txt" -Value $id -Force
          Write-Host "Cody: ID saved: $id"
          '@
          
          $scriptPath = "C:\Users\Public\setup_rustdesk.ps1"
          Set-Content -Path $scriptPath -Value $scriptContent -Force
          
          # Give codyuser permission to read the script (if needed)
          icacls $scriptPath /grant "${username}:(R)" | Out-Null
          
          $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($fullUsername, $securePassword)
          
          Write-Host "Cody: Running setup as $fullUsername ..."
          $outLog = "C:\Users\Public\rustdesk_out.log"
          $errLog = "C:\Users\Public\rustdesk_err.log"
          
          # Run with password passed as environment variable
          $process = Start-Process -FilePath "pwsh" `
              -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`"" `
              -Credential $credential `
              -Wait `
              -LoadUserProfile `
              -NoNewWindow `
              -RedirectStandardOutput $outLog `
              -RedirectStandardError $errLog `
              -PassThru `
              -Environment @{ CODY_PASS = $password }
          
          Write-Host "Cody: Child process exit code: $($process.ExitCode)"
          Write-Host "--- Child process stdout ---"
          if (Test-Path $outLog) { Get-Content $outLog | ForEach-Object { Write-Host $_ } }
          Write-Host "--- Child process stderr ---"
          if (Test-Path $errLog) { Get-Content $errLog | ForEach-Object { Write-Host $_ } }
          
          if ($process.ExitCode -ne 0) {
              Write-Error "Cody: Setup script failed with exit code $($process.ExitCode)"
              exit 1
          }
          
          # Read the ID from the file
          $idFile = "C:\Users\Public\rustdesk_id.txt"
          if (Test-Path $idFile) {
              $rustdeskId = (Get-Content $idFile -Raw).Trim()
              Write-Host "Cody: Retrieved ID from file: $rustdeskId"
              Add-Content -Path $env:GITHUB_ENV -Value "RUSTDESK_ID=$rustdeskId"
          }
          else {
              Write-Error "Cody: Failed to retrieve RustDesk ID file"
              exit 1
          }

      # Step 4: Keep the session alive
      - name: Cody - Session Active
        run: |
          $hours = [int]"${{ github.event.inputs.session_duration }}"
          if ($hours -gt 6) { $hours = 6 }
          $seconds = $hours * 3600
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "CODY IS READY"
          Write-Host "RustDesk ID: $env:RUSTDESK_ID"
          Write-Host "Running as: codyuser"
          Write-Host "Session: $hours hour(s)"
          Write-Host "========================================"
          Write-Host ""
          
          $start = Get-Date
          $count = 0
          
          while (((Get-Date) - $start).TotalSeconds -lt $seconds) {
              Start-Sleep -Seconds 60
              $count++
              if ($count % 5 -eq 0) {
                  $remaining = [math]::Round(($seconds - ((Get-Date) - $start).TotalSeconds) / 60)
                  Write-Host "Cody: Running... $remaining minutes left"
              }
          }
          
          Write-Host "Session ended"
