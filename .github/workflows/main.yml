name: Cody

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Hours to stay active (1-6)'
        required: true
        default: '4'

jobs:
  cody-job:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Cody - Install
        run: |
          $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.4.6/rustdesk-1.4.6-x86_64.exe"
          $installer = "$env:TEMP\rustdesk_installer.exe"
          
          Write-Host "Cody: Downloading RustDesk..."
          Invoke-WebRequest -Uri $rdUrl -OutFile $installer
          
          Write-Host "Cody: Starting Silent Install (Waiting for completion)..."
          $process = Start-Process -FilePath $installer -ArgumentList "--silent-install" -PassThru -NoNewWindow
          $process.WaitForExit()
          
          Write-Host "Cody: Waiting for service installation to complete..."
          $timeout = 0
          while (!(Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue) -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout++
          }
          
          $timeout = 0
          while ((Get-Service -Name "RustDesk").Status -ne 'Running' -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout++
          }
          Write-Host "Cody: RustDesk installed and running."

      - name: Cody - Create Admin User
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORDD }}
        run: |
          $rdPass = $env:RUSTDESK_PASSWORD
          
          if ([string]::IsNullOrWhiteSpace($rdPass)) {
              Write-Error "Cody: RUSTDESK_PASSWORD secret is empty or not configured."
              exit 1
          }
          
          $adminUsername = "admin"
          Write-Host "========================================"
          Write-Host "Cody: Creating local admin user..."
          Write-Host "========================================"
          
          try {
              $existingUser = Get-LocalUser -Name $adminUsername -ErrorAction Stop
              Write-Host "Cody: User '$adminUsername' already exists."
              
              if (!$existingUser.Enabled) {
                  Enable-LocalUser -Name $adminUsername
                  Write-Host "Cody: User '$adminUsername' enabled."
              }
          }
          catch {
              Write-Host "Cody: Creating new user '$adminUsername'..."
              try {
                  $securePassword = ConvertTo-SecureString -String $rdPass -AsPlainText -Force
                  New-LocalUser -Name $adminUsername `
                      -Password $securePassword `
                      -FullName "Cody Admin User" `
                      -Description "Local admin for RustDesk" `
                      -AccountNeverExpires `
                      -PasswordNeverExpires
              }
              catch {
                  Write-Error "Cody: Failed to create user: $_"
                  exit 1
              }
          }
          
          Write-Host "Cody: Validating credentials..."
          try {
              Add-Type -AssemblyName System.DirectoryServices.AccountManagement
              $contextType = [System.DirectoryServices.AccountManagement.ContextType]::Machine
              $principalContext = New-Object System.DirectoryServices.AccountManagement.PrincipalContext($contextType)
              
              if ($principalContext.ValidateCredentials($adminUsername, $rdPass)) {
                  Write-Host "Cody: ✓ Password validated successfully"
              } else {
                  Write-Error "Cody: Password validation failed"
                  exit 1
              }
          }
          catch {
              Write-Error "Cody: Validation error: $_"
              exit 1
          }
          
          try {
              Add-LocalGroupMember -Group "Administrators" -Member $adminUsername -ErrorAction SilentlyContinue
              Write-Host "Cody: ✓ User added to Administrators"
          }
          catch {
              Write-Host "Cody: User already in Administrators"
          }
          
          Add-Content -Path $env:GITHUB_ENV -Value "ADMIN_USER=$adminUsername"

      - name: Cody - Configure RustDesk
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORDD }}
        run: |
          $rdPass = $env:RUSTDESK_PASSWORD
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          
          Write-Host "========================================"
          Write-Host "Cody: Configuring RustDesk..."
          Write-Host "========================================"
          
          $service = Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          if (!$service) {
              Write-Error "Cody: RustDesk service not found"
              exit 1
          }
          
          if ($service.Status -ne 'Running') {
              Start-Service -Name "RustDesk" -Force
              Start-Sleep -Seconds 5
          }
          
          Write-Host "Cody: Step 1 - Setting TOML configuration files..."
          $tomlContent = "[options]`r`nverification-method = 'use-both-passwords'`r`napprove-mode = 'both'`r`nallow-remote-config-modification = 'Y'`r`nallow-logon-screen-password = 'Y'"
          
          $configPaths = @(
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config",
              "$env:APPDATA\RustDesk\config"
          )
          
          foreach ($path in $configPaths) {
              if (!(Test-Path $path)) {
                  New-Item -ItemType Directory -Path $path -Force | Out-Null
              }
              $tomlPath = Join-Path $path "RustDesk2.toml"
              Set-Content -Path $tomlPath -Value $tomlContent -Force
              Write-Host "Cody: Config written to: $tomlPath"
          }
          
          Write-Host "Cody: Step 2 - Stopping RustDesk service for clean configuration..."
          Stop-Service -Name "RustDesk" -Force
          Start-Sleep -Seconds 3
          
          Write-Host "Cody: Step 3 - Setting password via CLI (direct)..."
          try {
              Push-Location "C:\Program Files\RustDesk"
              
              Write-Host "Cody: Executing: rustdesk.exe --password <PASSWORD>"
              $output = & .\rustdesk.exe --password $rdPass 2>&1
              Write-Host "Cody: Password command output: $output"
              
              Write-Host "Cody: Executing: rustdesk.exe --option verification-method use-both-passwords"
              $output = & .\rustdesk.exe --option verification-method use-both-passwords 2>&1
              Write-Host "Cody: Verification method output: $output"
              
              Write-Host "Cody: Executing: rustdesk.exe --option approve-mode both"
              $output = & .\rustdesk.exe --option approve-mode both 2>&1
              Write-Host "Cody: Approve mode output: $output"
              
              Pop-Location
              Write-Host "Cody: ✓ Configuration commands executed"
          }
          catch {
              Write-Warning "Cody: CLI configuration warning: $_"
          }
          
          Write-Host "Cody: Step 4 - Starting RustDesk service..."
          Start-Service -Name "RustDesk" -Force
          Start-Sleep -Seconds 8
          
          Write-Host "Cody: Step 5 - Checking RustDesk process and logs..."
          $rdProcess = Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue
          if ($rdProcess) {
              Write-Host "Cody: ✓ RustDesk process running (PID: $($rdProcess.Id))"
          } else {
              Write-Warning "Cody: RustDesk process not found"
          }
          
          Write-Host "Cody: Step 6 - Checking RustDesk registry for password..."
          try {
              $regPath = "HKLM:\SOFTWARE\WOW6432Node\RustDesk"
              if (Test-Path $regPath) {
                  $regItems = Get-Item -Path $regPath | Select-Object -ExpandProperty Property
                  Write-Host "Cody: Registry keys found: $($regItems -join ', ')"
              } else {
                  Write-Host "Cody: Registry path not found (may be normal)"
              }
          }
          catch {
              Write-Host "Cody: Could not check registry: $_"
          }
          
          Write-Host "Cody: Step 7 - Retrieving RustDesk ID..."
          $id = ""
          $retries = 0
          while ([string]::IsNullOrWhiteSpace($id) -and $retries -lt 15) {
              try {
                  Push-Location "C:\Program Files\RustDesk"
                  $id = (& .\rustdesk.exe --get-id 2>&1 | Out-String).Trim()
                  Pop-Location
                  
                  if ([string]::IsNullOrWhiteSpace($id)) {
                      Write-Host "Cody: ID not ready (Attempt $($retries + 1)/15), waiting..."
                      Start-Sleep -Seconds 3
                      $retries++
                  } else {
                      Write-Host "Cody: ✓ ID retrieved: $id"
                  }
              }
              catch {
                  Write-Host "Cody: Error retrieving ID: $_"
                  Start-Sleep -Seconds 3
                  $retries++
              }
          }
          
          if ([string]::IsNullOrWhiteSpace($id)) {
              Write-Error "Cody: Failed to retrieve RustDesk ID"
              exit 1
          }
          
          Write-Host "========================================"
          Write-Host "CODY RUSTDESK ID: $id"
          Write-Host "CODY PASSWORD: [HIDDEN]"
          Write-Host "CODY CONFIG: verification-method = use-both-passwords"
          Write-Host "========================================"
          
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTDESK_ID=$id"

      - name: Cody - Verify Configuration
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORDD }}
        run: |
          $rdPass = $env:RUSTDESK_PASSWORD
          
          Write-Host "========================================"
          Write-Host "Cody: Verifying RustDesk Configuration..."
          Write-Host "========================================"
          
          Write-Host "Cody: Checking config file contents..."
          $configFiles = @(
              "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk2.toml",
              "$env:APPDATA\RustDesk\config\RustDesk2.toml"
          )
          
          foreach ($file in $configFiles) {
              if (Test-Path $file) {
                  Write-Host "Cody: Config file: $file"
                  Get-Content -Path $file | ForEach-Object { Write-Host "  $_" }
              }
          }
          
          Write-Host "Cody: Checking RustDesk service status..."
          $service = Get-Service -Name "RustDesk"
          Write-Host "Cody: Service Status: $($service.Status)"
          
          Write-Host "Cody: Checking password is correctly stored..."
          Write-Host "Cody: ✓ Password validation will be tested on connection"
          Write-Host "========================================"

      - name: Cody - Session
        run: |
          $hours = [int]"${{ github.event.inputs.session_duration }}"
          if ($hours -gt 6) { $hours = 6 }
          $seconds = $hours * 3600
          
          Write-Host "========================================"
          Write-Host "Cody: Runner is ACTIVE and READY"
          Write-Host "Session Duration: $hours hour(s)"
          Write-Host "========================================"
          
          $startTime = Get-Date
          $elapsedMinutes = 0
          
          while (((Get-Date) - $startTime).TotalSeconds -lt $seconds) {
              Start-Sleep -Seconds 60
              $elapsedMinutes++
              if ($elapsedMinutes % 5 -eq 0) {
                  $remainingTime = [math]::Round(($seconds - ((Get-Date) - $startTime).TotalSeconds) / 60, 0)
                  Write-Host "Cody: Active... $remainingTime minutes remaining"
              }
          }
          
          Write-Host "Cody: Session ended"
