name: Cody

on:
  workflow_dispatch:
    inputs:
      session_duration:
        description: 'Hours to stay active (1-6)'
        required: true
        default: '4'

jobs:
  cody-job:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # Step 1: Create the codyuser account
      - name: Cody - Create User
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORDD }}
        run: |
          $password = $env:RUSTDESK_PASSWORD
          $username = "codyuser"
          
          Write-Host "Cody: Creating user '$username'..."
          $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
          
          try {
              Get-LocalUser -Name $username -ErrorAction Stop
              Write-Host "Cody: User already exists"
          }
          catch {
              New-LocalUser -Name $username -Password $securePassword -PasswordNeverExpires -Description "RustDesk Service User"
              Write-Host "Cody: User created"
          }
          
          Write-Host "Cody: Adding user to Administrators..."
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Write-Host "Cody: User setup complete"
          
          Add-Content -Path $env:GITHUB_ENV -Value "CODY_USER=$username"
          Add-Content -Path $env:GITHUB_ENV -Value "CODY_PASS=$password"

      # Step 2: Grant logon rights
      - name: Cody - Grant Logon Rights
        run: |
          $username = $env:CODY_USER
          $computerName = $env:COMPUTERNAME
          $fullUsername = "$computerName\$username"
          
          Write-Host "Cody: Granting 'Log on as a batch job' and 'Log on as a service' to $fullUsername"
          
          $secpolPath = "$env:TEMP\secpol.cfg"
          secedit /export /cfg $secpolPath | Out-Null
          
          $sid = (New-Object System.Security.Principal.NTAccount($fullUsername)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          
          $content = Get-Content $secpolPath
          $newContent = foreach ($line in $content) {
              if ($line -match "^SeServiceLogonRight\s*=" -and $line -notmatch [regex]::Escape($sid)) {
                  $line = $line.TrimEnd() + ",*$sid"
              }
              if ($line -match "^SeBatchLogonRight\s*=" -and $line -notmatch [regex]::Escape($sid)) {
                  $line = $line.TrimEnd() + ",*$sid"
              }
              $line
          }
          $newContent | Set-Content $secpolPath -Force
          
          secedit /configure /db secedit.sdb /cfg $secpolPath /areas USER_RIGHTS | Out-Null
          Write-Host "Cody: Rights granted"

      # Step 3: Install RustDesk (fast method)
      - name: Cody - Install RustDesk
        run: |
          $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.4.6/rustdesk-1.4.6-x86_64.exe"
          $installer = "$env:TEMP\rustdesk_installer.exe"
          Write-Host "Cody: Downloading RustDesk..."
          Invoke-WebRequest -Uri $rdUrl -OutFile $installer
          
          Write-Host "Cody: Starting Silent Install..."
          $process = Start-Process -FilePath $installer -ArgumentList "--silent-install" -PassThru -NoNewWindow
          $process.WaitForExit()
          
          Write-Host "Cody: Waiting for service installation..."
          $timeout = 0
          while (!(Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue) -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout++
          }
          $timeout = 0
          while ((Get-Service -Name "RustDesk").Status -ne 'Running' -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout++
          }
          
          if (!(Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue)) {
              Write-Error "Cody: RustDesk service not installed."
              exit 1
          }
          Write-Host "Cody: Installation complete."

      # Step 4: Configure RustDesk service to run as codyuser
      - name: Cody - Configure Service
        run: |
          $username = $env:CODY_USER
          $password = $env:CODY_PASS
          $computerName = $env:COMPUTERNAME
          $fullUsername = "$computerName\$username"
          
          Write-Host "Cody: Stopping RustDesk service..."
          Stop-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          
          Write-Host "Cody: Setting service to run as $fullUsername ..."
          $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($fullUsername, $securePassword)
          
          Set-Service -Name "RustDesk" -Credential $credential
          Write-Host "Cody: Service credential updated."

      # Step 5: Initialize codyuser profile (important!)
      - name: Cody - Initialize User Profile
        run: |
          $username = $env:CODY_USER
          $password = $env:CODY_PASS
          $computerName = $env:COMPUTERNAME
          $fullUsername = "$computerName\$username"
          
          Write-Host "Cody: Initializing profile for $fullUsername ..."
          $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($fullUsername, $securePassword)
          
          # Run a harmless process as codyuser to trigger profile creation
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c exit" -Credential $credential -LoadUserProfile -Wait -NoNewWindow
          Write-Host "Cody: Profile initialized."

      # Step 6: Start service and set password via CLI (as admin)
      - name: Cody - Set Password via CLI
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORDD }}
        run: |
          $rdPass = $env:RUSTDESK_PASSWORD
          
          Write-Host "Cody: Starting RustDesk service..."
          Start-Service -Name "RustDesk"
          Start-Sleep -Seconds 10
          
          Write-Host "Cody: Setting RustDesk password via CLI..."
          Push-Location "C:\Program Files\RustDesk"
          & .\rustdesk.exe --password $rdPass | Out-Null
          Pop-Location
          
          Write-Host "Cody: Restarting RustDesk service..."
          Restart-Service -Name "RustDesk" -Force
          Start-Sleep -Seconds 15
          
          # Verify service is running
          $svc = Get-Service -Name "RustDesk"
          Write-Host "Cody: RustDesk service status: $($svc.Status)"
          if ($svc.Status -ne 'Running') {
              Write-Error "Cody: RustDesk service failed to start."
              exit 1
          }
          Write-Host "Cody: Password set and service restarted."

      # Step 7: Retrieve the correct ID from codyuser's config
      - name: Cody - Get RustDesk ID
        run: |
          Write-Host "Cody: Retrieving RustDesk ID from codyuser profile..."
          $username = $env:CODY_USER
          $configPath = "C:\Users\$username\AppData\Roaming\RustDesk\config\RustDesk2.toml"
          
          # Wait for the config file to be created by the service
          $timeout = 0
          while (!(Test-Path $configPath) -and $timeout -lt 30) {
              Write-Host "Cody: Waiting for config file..."
              Start-Sleep -Seconds 2
              $timeout++
          }
          
          $id = ""
          if (Test-Path $configPath) {
              $content = Get-Content $configPath -Raw
              Write-Host "Cody: Config file found (masked):"
              Write-Host ($content -replace 'permanent-password.*', 'permanent-password = [REDACTED]')
              if ($content -match '^id\s*=\s*"([^"]+)"') {
                  $id = $Matches[1]
              } elseif ($content -match '^id\s*=\s*''([^'']+)''') {
                  $id = $Matches[1]
              }
          }
          
          # Fallback: run rustdesk --get-id as codyuser (not admin)
          if ([string]::IsNullOrWhiteSpace($id)) {
              Write-Host "Cody: Falling back to CLI --get-id as codyuser..."
              $securePassword = ConvertTo-SecureString -String $env:CODY_PASS -AsPlainText -Force
              $credential = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$env:CODY_USER", $securePassword)
              
              # Run a small script as codyuser to get the ID
              $scriptPath = "C:\Users\Public\get_rustdesk_id.ps1"
              Set-Content -Path $scriptPath -Value '& "C:\Program Files\RustDesk\rustdesk.exe" --get-id' -Force
              
              $outLog = "C:\Users\Public\get_id_out.log"
              $errLog = "C:\Users\Public\get_id_err.log"
              
              $process = Start-Process -FilePath "pwsh" `
                  -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`"" `
                  -Credential $credential `
                  -Wait `
                  -LoadUserProfile `
                  -NoNewWindow `
                  -RedirectStandardOutput $outLog `
                  -RedirectStandardError $errLog `
                  -PassThru
              
              if ($process.ExitCode -eq 0 -and (Test-Path $outLog)) {
                  $id = (Get-Content $outLog -Raw).Trim()
              }
          }
          
          if ([string]::IsNullOrWhiteSpace($id)) {
              Write-Error "Cody: Failed to retrieve RustDesk ID"
              exit 1
          }
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "CODY RUSTDESK ID : $id"
          Write-Host "CODY PASSWORD    : [HIDDEN]"
          Write-Host "========================================"
          Write-Host ""
          
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTDESK_ID=$id"

      # Step 8: Keep session alive
      - name: Cody - Session Active
        run: |
          $hours = [int]"${{ github.event.inputs.session_duration }}"
          if ($hours -gt 6) { $hours = 6 }
          $seconds = $hours * 3600
          
          Write-Host ""
          Write-Host "========================================"
          Write-Host "CODY IS READY"
          Write-Host "RustDesk ID: $env:RUSTDESK_ID"
          Write-Host "Running as: codyuser"
          Write-Host "Session: $hours hour(s)"
          Write-Host "========================================"
          Write-Host ""
          
          $start = Get-Date
          $count = 0
          
          while (((Get-Date) - $start).TotalSeconds -lt $seconds) {
              Start-Sleep -Seconds 60
              $count++
              if ($count % 5 -eq 0) {
                  $remaining = [math]::Round(($seconds - ((Get-Date) - $start).TotalSeconds) / 60)
                  Write-Host "Cody: Running... $remaining minutes left"
              }
          }
          
          Write-Host "Session ended"
